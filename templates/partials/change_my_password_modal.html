<div class="modal fade" id="changeMyPasswordModal" tabindex="-1" aria-labelledby="changeMyPasswordModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-brand text-white">
                <h5 class="modal-title" id="changeMyPasswordModalLabel"><i class="bi bi-key"></i> Change Password</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="changeMyPasswordForm" autocomplete="off">
                <div class="modal-body">
                    <div id="changeMyPasswordAlert" class="alert alert-danger d-none py-2 small" role="alert"></div>
                    <p class="text-muted small mb-3">
                        Enter your current password, then choose a new one. You will use the new password the next time you log in.
                    </p>
                    <div class="mb-3">
                        <label for="currentPassword" class="form-label">Current password</label>
                        <input type="password" id="currentPassword" name="current_password" class="form-control" required autocomplete="current-password">
                    </div>
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">New password</label>
                        <input type="password" id="newPassword" name="new_password" class="form-control" required minlength="4" autocomplete="new-password">
                    </div>
                    <div class="mb-0">
                        <label for="confirmPassword" class="form-label">Confirm new password</label>
                        <input type="password" id="confirmPassword" name="confirm_password" class="form-control" required minlength="4" autocomplete="new-password">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-brand">Update Password</button>
                </div>
            </form>
        </div>
    </div>
</div>
